# Push a tag to release:  npm version patch && git push --follow-tags
# Re-run a release's workflow to publish it again, e.g. after adding a token.
# Publishes to the VS Code Marketplace and Open VSX when their tokens
# (VSCE_PAT, OVSX_PAT) are set as repository secrets, and always attaches
# the .vsix to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm run test:unit
      - run: npx vsce package --no-dependencies -o agda-mode-telemetry-${GITHUB_REF_NAME}.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=agda-mode-telemetry-${GITHUB_REF_NAME}.vsix
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$f" --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath agda-mode-telemetry-${GITHUB_REF_NAME}.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx ovsx publish agda-mode-telemetry-${GITHUB_REF_NAME}.vsix
